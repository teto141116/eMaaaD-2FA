name: Build eMaD 2FA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q eMaD2FA_GitHub_FIXED.zip -d project

      - name: Check extracted project
        working-directory: project
        run: |
          echo "Project files:"
          ls -la
          echo "App directory:"
          ls -la app

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eMaD-2FA
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
